<form (submit)="onSubmit($event)" class="organ-form">
  <h2>{{ 'PAGES.ORGAN.FORM.TITLE' | translate }}</h2>

  <!-- General Settings Section -->
  <div class="cranc-form-section">
    <h3>{{ 'PAGES.ORGAN.FORM.GENERAL_SETTINGS' | translate }}</h3>
    <cranc-text-form-field
      [field]="organForm.name"
      label="PAGES.ORGAN.FORM.NAME"
    />
  </div>

  <!-- Tape Settings Section -->
  <div class="cranc-form-section">
    <h3>{{ 'PAGES.ORGAN.FORM.TAPE_SETTINGS' | translate }}</h3>
    <cranc-number-form-field
      [field]="organForm.tape.tapeWidthMm"
      label="PAGES.ORGAN.FORM.TAPE_WIDTH_MM"
      class="column"
    />
    <cranc-number-form-field
      [field]="organForm.tape.tapeBorderMm"
      label="PAGES.ORGAN.FORM.TAPE_BORDER_MM"
    />
    <mat-divider></mat-divider>
    <h4>{{ 'PAGES.ORGAN.FORM.HOLE_SETTINGS' | translate }}</h4>
    <cranc-number-form-field
      [field]="organForm.tape.holeDiameterMm"
      label="PAGES.ORGAN.FORM.HOLE_DIAMETER_MM"
      class="column"
    />
    <cranc-number-form-field
      [field]="organForm.tape.holeSpacingMm"
      label="PAGES.ORGAN.FORM.HOLE_SPACING_MM"
    />
  </div>

  <!-- Pipes Form Section -->
  <cranc-pipes-form [field]="organForm.pipes"/>

  <!-- Form Action Section -->
  <div class="cranc-form-section">
    <div class="actions">
      <button matButton="outlined" type="button" (click)="onDiscard()" [disabled]="cannotDiscard()">
        {{ 'PAGES.ORGAN.FORM.DISCARD' | translate }}
      </button>
      <button matButton="tonal" type="button" (click)="organModel.update(addPipe())">
        <mat-icon>add</mat-icon>
        {{ 'PAGES.ORGAN.FORM.NEW_PIPE' | translate }}
      </button>
      <button matButton="filled" type="submit" [disabled]="cannotSave()">
        <mat-icon>save</mat-icon>
        {{ 'PAGES.ORGAN.FORM.SAVE' | translate }}
      </button>
    </div>
  </div>
</form>
