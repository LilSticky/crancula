<div cdkDropList class="pipe-form-list cranc-form-section" (cdkDropListDropped)="drop($event)">
  <h3>{{ 'PAGES.ORGAN.FORM.PIPE_SETTINGS' | translate }}</h3>
  @for (pipe of pipes(); track pipe.index) {
    <div class="pipes-form-row" cdkDrag>
      <cranc-text-form-field
        [(value)]="pipe.name"
        label="PAGES.ORGAN.FORM.PIPE_NAME"
        class="column"
      />
      <cranc-number-form-field
        [(value)]="pipe.pitch"
        label="PAGES.ORGAN.FORM.PIPE_PITCH"
        class="column"
      />
      <span class="cranc-form-section pipe-actions">
        <button matIconButton type="button" (click)="remove(pipe)">
          <mat-icon>delete</mat-icon>
        </button>
        <button matIconButton type="button" (click)="moveUp(pipe)" [disabled]="pipe.index <= 0">
          <mat-icon>keyboard_arrow_up</mat-icon>
        </button>
        <button matIconButton type="button" (click)="moveDown(pipe)" [disabled]="pipe.index >= pipes().length - 1">
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </span>
    </div>
  }
</div>
