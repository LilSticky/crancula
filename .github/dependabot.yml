version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "@angular-architects/*"
          - "@ngrx/*"
          - "zone.js"
      angular-eslint:
        patterns:
          - "angular-eslint"
          - "@angular-eslint/*"
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
    ignore:
      # Hold until the Electron Node runtime moves beyond 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hold until Angular's peer range allows TypeScript 7 (#136).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
