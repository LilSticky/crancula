name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        if: always()
      - name: Translations
        run: npm run i18n:check
        if: always()
      - name: Test
        run: npm run test
        if: always()
      - name: Build
        run: npm run build
        if: always()
      # The e2e suite drives the real Electron app; it replaces a manual walkthrough (ADR 13).
      - name: Allow the Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests (Linux)
        if: always() && runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - name: End-to-end tests
        if: always() && runner.os != 'Linux'
        run: npm run e2e
      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.os }}
          path: e2e/screenshots/
          retention-days: 7
